<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TailoredFeed - Einstellungen</title>
  <style>
    /* Wiederverwendete Animationen aus Seite 1 */
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    
    @keyframes shine {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #000000;
      color: white;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(30,30,30,1) 0%, rgba(0,0,0,1) 70%);
      z-index: -1;
    }

    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        radial-gradient(1px 1px at 25% 25%, white 100%, transparent 0),
        radial-gradient(1px 1px at 50% 50%, white 100%, transparent 0),
        radial-gradient(2px 2px at 75% 75%, white 100%, transparent 0),
        radial-gradient(2px 2px at 10% 90%, white 100%, transparent 0),
        radial-gradient(1px 1px at 85% 15%, white 100%, transparent 0);
      background-size: 500px 500px;
      opacity: 0.3;
      z-index: -1;
    }

    /* Navigation / Zurück-Button */
    .nav {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 2; /* Wichtig, damit der Button nicht verdeckt wird */
    }
    .back-button {
      background: none;
      border: none;
      color: white;
      font-size: 3vh;
      cursor: pointer;
    }
    
    /* Haupt-Container */
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      height: 100%;
      padding: 0 5%;
      box-sizing: border-box;
      position: relative;
      z-index: 1;
    }

    .brand {
      font-size: 6vh;
      font-weight: 900;
      margin-bottom: 5vh;
      background: linear-gradient(45deg, #00dbde, #fc00ff, #00dbde);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 3s linear infinite;
      letter-spacing: -1px;
    }

    /* Formular-Bereich */
    .form-container {
      display: flex;
      flex-direction: column;
      gap: 2vh;
      width: 80%;
      max-width: 400px;
    }
    
    .section-heading {
      font-size: 2.5vh;
      font-weight: bold;
      margin-bottom: 1vh;
      text-transform: uppercase;
      color: #ccc;
    }
    
    /* Buttons für Geschlecht und Altersgruppen */
    .option-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 2vh;
      justify-content: center;
    }

    .option-button {
      flex: 1 1 auto;
      padding: 1.2em;
      border: none;
      border-radius: 5px;
      font-size: 2.2vh;
      cursor: pointer;
      box-sizing: border-box;
      background: #333;
      color: white;
      transition: transform 0.2s, background 0.2s;
      min-width: 30%;
    }

    .option-button:hover {
      transform: scale(1.05);
      background: #444;
    }

    /* Eingabefelder */
    .form-field {
      display: flex;
      flex-direction: column;
      gap: 0.5vh;
    }
    .form-field input[type="text"] {
      width: 100%;
      padding: 1.2em 1em;
      border: none;
      border-radius: 5px;
      font-size: 2.2vh;
      box-sizing: border-box;
      color: #333;
    }
    .form-field input::placeholder {
      color: #999;
    }

    /* Weiter-Button unten */
    .continue-button {
      margin-top: 3vh;
      background: none;
      border: none;
      color: white;
      font-size: 3vh;
      cursor: pointer;
      animation: pulse 3s ease-in-out infinite;
    }

    /* Standort & Datum */
    .location {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-size: 2.2vh;
      opacity: 0.7;
    }
    .date {
      position: absolute;
      bottom: 20px;
      right: 20px;
      font-size: 2.2vh;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="background"></div>
  <div class="stars"></div>

  <!-- Navigation -->
  <div class="nav">
    <button class="back-button" onclick="window.location.href='TailoredFeedHomescreen.html'">←</button>
  </div>

  <div class="container">
    <div class="brand">tailoredfeed</div>
    
    <div class="form-container">
      <!-- Altersgruppen -->
      <div>
        <div class="section-heading">Wähle deine Altersgruppe</div>
        <div class="option-buttons">
          <button class="option-button" onclick="console.log('Altersgruppe: 18-23')">18–23</button>
          <button class="option-button" onclick="console.log('Altersgruppe: 24-29')">24–29</button>
          <button class="option-button" onclick="console.log('Altersgruppe: 30-35')">30–35</button>
          <button class="option-button" onclick="console.log('Altersgruppe: 36-45')">36–45</button>
          <button class="option-button" onclick="console.log('Altersgruppe: 46-55')">46–55</button>
          <button class="option-button" onclick="console.log('Altersgruppe: 55+')">55+</button>
        </div>
      </div>

      <!-- Geschlecht -->
      <div>
        <div class="section-heading">Wähle dein Geschlecht</div>
        <div class="option-buttons">
          <button class="option-button" onclick="console.log('Geschlecht: Männlich')">Männlich</button>
          <button class="option-button" onclick="console.log('Geschlecht: Weiblich')">Weiblich</button>
          <button class="option-button" onclick="console.log('Geschlecht: Divers')">Divers</button>
        </div>
      </div>

      <!-- Sprache -->
      <div class="form-field">
        <label for="lang">Bevorzugte Sprache:</label>
        <input type="text" id="lang" name="lang" placeholder="z.B. Deutsch">
      </div>

      <!-- Dialekt -->
      <div class="form-field">
        <label for="dialect">Optionaler Dialekt:</label>
        <input type="text" id="dialect" name="dialect" placeholder="z.B. Bayrisch">
      </div>
    </div>

    <!-- Weiter-Button -->
    <button class="continue-button" onclick="window.location.href='page3.html'">
      ➜
    </button>
  </div>

  <div class="location">📍 München - Maxvorstadt</div>
  <div class="date">Dienstag der 3.02.2025</div>
</body>
</html>
