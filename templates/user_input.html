<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TailoredFeed - Einstellungen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        .error-message {
            color: #ff4444;
            margin-top: 5px;
            display: none;
        }
        .language-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .language-flag {
            width: 20px;
            height: 15px;
            object-fit: contain;
        }
        select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: white;
            padding: 12px;
            width: 100%;
            margin-bottom: 15px;
            font-size: 16px;
            height: 50px;
        }
        
        select option {
            background: #2a2a2a;
            color: white;
            padding: 10px;
            border: none;
        }
        
        select option:hover {
            background: #3a3a3a;
            color: white;
        }
        
        select option:checked {
            background: #4a4a4a;
            color: white;
        }
        
        input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            color: white;
            padding: 12px;
            width: 96.5%;
            margin-bottom: 15px;
            font-size: 16px;
            height: 50px;
        }
        .required::after {
            content: "*";
            color: #ff4444;
            margin-left: 4px;
        }
        .complexity-description {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            margin-top: -10px;
            margin-bottom: 15px;
            padding-left: 5px;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="stars"></div>

    <div class="container">
        <div class="brand">tailoredfeed</div>
        
        <form id="userInfoForm" class="settings-form">
            <h2>Persönliche Einstellungen</h2>
            
            <label for="complexity_level" class="required">Sprachkomplexität</label>
            <select id="complexity_level" name="complexity_level" required>
                <option value="">Bitte wählen</option>
                <option value="einfach">Einfach - Kinderfreundliche Sprache</option>
                <option value="standard">Standard - Verständliche Jugendsprache</option>
                <option value="komplex">Komplex - Erwachsenengerechte Fachsprache</option>
            </select>
            <div id="complexity-error" class="error-message">Bitte wähle eine Sprachkomplexität aus</div>

            <label for="language" class="required">Sprache</label>
            <select id="language" name="language" required>
                <option value="">Bitte wählen</option>
                <option value="Deutsch" class="language-option">
                    🇩🇪 Deutsch
                </option>
                <option value="English" class="language-option">
                    🇬🇧 English
                </option>
                <option value="Français" class="language-option">
                    🇫🇷 Français
                </option>
                <option value="Español" class="language-option">
                    🇪🇸 Español
                </option>
                <option value="Русский" class="language-option">
                    🇷🇺 Русский
                </option>
                <option value="Română" class="language-option">
                    🇷🇴 Română
                </option>
            </select>
            <div id="language-error" class="error-message">Bitte wähle eine Sprache aus</div>

            <label for="dialect">Dialekt (optional)</label>
            <input type="text" id="dialect" name="dialect" placeholder="z.B. Bayrisch">

            <button type="submit" class="cta-button">Weiter</button>
        </form>
    </div>

    <div class="location">📍 München - Maxvorstadt</div>
    <div class="date"></div>

    <script>
        document.getElementById('userInfoForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Reset error messages
            document.querySelectorAll('.error-message').forEach(msg => msg.style.display = 'none');
            
            // Get form values
            const complexityLevel = document.getElementById('complexity_level').value;
            const language = document.getElementById('language').value;
            const dialect = document.getElementById('dialect').value;
            
            // Validation
            let hasError = false;
            
            if (!complexityLevel) {
                document.getElementById('complexity-error').style.display = 'block';
                hasError = true;
            }
            if (!language) {
                document.getElementById('language-error').style.display = 'block';
                hasError = true;
            }
            
            if (hasError) return;
            
            // Submit form data
            fetch('/submit-user-info', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    complexity_level: complexityLevel,
                    language: language,
                    dialect: dialect
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/categories';
                } else {
                    alert(data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Ein Fehler ist aufgetreten. Bitte versuche es erneut.');
            });
        });

        // Update date
        const options = { weekday: 'long', year: 'numeric', month: 'numeric', day: 'numeric' };
        const date = new Date().toLocaleDateString('de-DE', options);
        document.querySelector('.date').textContent = date;
    </script>
</body>
</html>
