<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TailoredFeed - Kategorien & Newsformat</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="background"></div>
  <div class="stars"></div>

  <div class="nav">
    <a href="{{ url_for('user_input') }}">
      <button class="back-button">←</button>
    </a>
  </div>

  <div class="container">
    <div class="brand">tailoredfeed</div>
    
    <div class="section-heading">
      Wähle nun maximal 2 Kategorien aus, die für dich interessant sind:
    </div>
    <div id="category-limit-message" style="display: none; color: #ff6b6b; text-align: center; margin-bottom: 15px; font-size: 14px; background: rgba(255,107,107,0.1); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,107,107,0.3);">
      Du kannst maximal 2 Kategorien auswählen. Bitte entferne eine Auswahl, um eine neue hinzuzufügen.
    </div>
    <div class="option-buttons category-buttons">
      <button class="option-button" data-value="politik">Politik</button>
      <button class="option-button" data-value="wissenschaft">Wissenschaft/Forschung</button>
      <button class="option-button" data-value="wissenswertes">Wissenswertes</button>
      <button class="option-button" data-value="wirtschaft">Wirtschaft und Finanzen</button>
      <button class="option-button" data-value="gesundheit">Gesundheit und Medizin</button>
      <button class="option-button" data-value="muenchen">München aktuell</button>
      <button class="option-button" data-value="technologie">Technologie und Innovation</button>
      <button class="option-button" data-value="sport">Sport</button>
      <button class="option-button" data-value="custom">Custom Suche</button>
    </div>

    <!-- Custom Search Input Field (initially hidden) -->
    <div id="custom-search-container" style="display: none; margin-top: 20px;">
      <div class="section-heading">
        Gib deinen Suchbegriff ein:
      </div>
      <input type="text" id="custom-search-input" placeholder="z.B. Fußball WM, Bitcoin, Künstliche Intelligenz..." 
             style="width: 100%; padding: 15px; font-size: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 10px; background: rgba(255,255,255,0.1); color: white; margin-bottom: 15px; box-sizing: border-box; transition: all 0.3s ease;"
             onfocus="this.style.borderColor='rgba(0,219,222,0.8)'; this.style.background='rgba(255,255,255,0.15)'"
             onblur="this.style.borderColor='rgba(255,255,255,0.3)'; this.style.background='rgba(255,255,255,0.1)'"
             oninput="this.style.color='white'">
    </div>

    <div class="section-heading">
      Wähle dein Newsformat aus:
    </div>
    <div class="option-buttons format-buttons">
      <button class="option-button" data-value="kurz">Kurzmeldungen</button>
      <button class="option-button" data-value="ausfuehrlich">Ausführliche Artikel</button>
    </div>

    <button class="continue-button" onclick="submitForm('categories')">➜</button>
  </div>

  <div class="location">📍 München - Maxvorstadt</div>
  <div class="date"></div>

  <script src="{{ url_for('static', filename='scripts.js') }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Kategorien-Buttons
      document.querySelectorAll('.category-buttons .option-button').forEach(button => {
        button.addEventListener('click', function() {
          const selectedCategories = document.querySelectorAll('.category-buttons .option-button.selected');
          const limitMessage = document.getElementById('category-limit-message');
          
          // Wenn Button bereits ausgewählt ist, deselektiere ihn
          if (this.classList.contains('selected')) {
            this.classList.remove('selected');
            limitMessage.style.display = 'none';
          } else {
            // Wenn noch keine 2 Kategorien ausgewählt sind, kann ausgewählt werden
            if (selectedCategories.length < 2) {
              this.classList.add('selected');
              limitMessage.style.display = 'none';
            } else {
              // Zeige Limit-Nachricht
              limitMessage.style.display = 'block';
              // Nach 3 Sekunden wieder ausblenden
              setTimeout(() => {
                limitMessage.style.display = 'none';
              }, 3000);
            }
          }
          
          // Zeige/verstecke Custom Search Input
          const customSearchContainer = document.getElementById('custom-search-container');
          const isCustomSelected = document.querySelector('.category-buttons .option-button[data-value="custom"]').classList.contains('selected');
          
          if (isCustomSelected) {
            customSearchContainer.style.display = 'block';
          } else {
            customSearchContainer.style.display = 'none';
            document.getElementById('custom-search-input').value = '';
          }
        });
      });
      
      // Format-Buttons
      document.querySelectorAll('.format-buttons .option-button').forEach(button => {
        button.addEventListener('click', function() {
          document.querySelectorAll('.format-buttons .option-button').forEach(btn => btn.classList.remove('selected'));
          this.classList.add('selected');
        });
      });
    });

    // Submit-Funktion für das Kategorien-Formular
    function submitForm(formType) {
      if (formType === 'categories') {
        // Ausgewählte Kategorien sammeln
        const selectedCategories = [];
        document.querySelectorAll('.category-buttons .option-button.selected').forEach(button => {
          selectedCategories.push(button.getAttribute('data-value'));
        });
        
        // Custom Search Term sammeln
        let customSearchTerm = '';
        const isCustomSelected = selectedCategories.includes('custom');
        if (isCustomSelected) {
          customSearchTerm = document.getElementById('custom-search-input').value.trim();
          if (!customSearchTerm) {
            alert('Bitte gib einen Suchbegriff für die Custom Suche ein.');
            return;
          }
        }
        
        // Validierung: Mindestens 1, maximal 2 Kategorien
        if (selectedCategories.length === 0) {
          alert('Bitte wähle mindestens eine Kategorie aus.');
          return;
        }
        
        if (selectedCategories.length > 2) {
          alert('Du kannst maximal 2 Kategorien auswählen.');
          return;
        }
        
        // Ausgewähltes Format ermitteln
        const selectedFormat = document.querySelector('.format-buttons .option-button.selected');
        const formatValue = selectedFormat ? selectedFormat.getAttribute('data-value') : '';
        
        // Formular-Daten vorbereiten
        const formData = new FormData();
        formData.append('categories', JSON.stringify(selectedCategories));
        formData.append('format', formatValue);
        formData.append('custom_search_term', customSearchTerm);
        
        // Daten an den Server senden
        fetch('/submit-categories', {
          method: 'POST',
          body: formData
        })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            window.location.href = '/generating_news';  // Hier ist die Weiterleitung zur generating_news Seite
          } else {
            alert(data.message);
          }
        })
        .catch(error => {
          console.error('Error:', error);
          alert('Ein Fehler ist aufgetreten. Bitte versuche es erneut.');
        });
      }
    }
  </script>
</body>
</html>
