<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TailoredFeed - Newsvorbereitung</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="background"></div>
  <div class="stars"></div>
  
  <div class="container">
    <div class="brand">tailoredfeed</div>
    
    <h2 class="subheadline">
      Willkommen bei <span class="highlight">TailoredFeed</span>
    </h2>
    
    <p class="section-heading">
      Bevor wir starten können, müssen wir die aktuellsten News laden.
    </p>
    
    <a href="{{ url_for('update_news') }}">
      <button class="cta-button">
        News vorbereiten <span class="arrow">→</span>
      </button>
    </a>
  </div>
  
  <div class="location">📍 München - Maxvorstadt</div>
  <div class="date"></div>
  
  <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>
</html>
